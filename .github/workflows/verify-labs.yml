name: Verify All 66 Labs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Red-to-Green contract across all 66 labs
        run: python3 scripts/verify_all_labs.py --audit-both
