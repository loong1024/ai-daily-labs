# S6-M01 电商客服分级退赔与订单抽取回归评测 —— 起点半成品（存在多处回归门禁缺陷）
description: "电商智能客服退赔分流回归评测（基线草稿）"

prompts:
  - file://prompts/triage_v1.txt
  - file://prompts/triage_v2_broken.txt

providers:
  - id: openai:chat:gpt-4o-mini
    config:
      temperature: 0.7

ci_gate:
  min_pass_rate: 0.60
  block_on_regression: false
  rollback_prompt: ""

tests:
  - description: "简单查快递样例"
    vars:
      case_id: "cs_01"
      text: "麻烦查下订单 ORD-880101 发什么快递、大概哪天能到杭州？"
    assert:
      - type: llm-rubric
        value: "输出看起来能查物流即可"
  - description: "简单催发货样例"
    vars:
      case_id: "cs_02"
      text: "订单号 ORD-880102 还没揽收，帮我确认下今天仓库能不能发出"
    assert:
      - type: llm-rubric
        value: "输出包含订单号即可"
  - description: "简单小额退差样例"
    vars:
      case_id: "cs_06"
      text: "单号 ORD-880202 昨晚买贵了，同款今天官旗直降了 35 元，申请退保价差额 35 元"
    assert:
      - type: llm-rubric
        value: "输出同意退差价 35 元即可"
