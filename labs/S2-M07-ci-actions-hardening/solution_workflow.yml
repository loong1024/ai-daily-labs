# 防御架构概念示意模板（核心机制：最小权限收敛、环境变量数据隔离、不可变版本引用）
name: ai-issue-triage-hardened-concept
on:
  issues:
    types: [opened]

permissions:
  contents: "<conceptual_placeholder>"

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with immutable commit digest
        uses: "<conceptual_placeholder>"
      - name: Read untrusted event data via environment variable boundary
        env:
          ISSUE_TITLE: "<conceptual_placeholder>"
          ISSUE_BODY: "<conceptual_placeholder>"
        run: "<conceptual_placeholder>"
