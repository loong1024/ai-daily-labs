<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>门店/个人经营收支与目标追踪可视化看板</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --income-bg: #dcfce7;
      --income-fg: #15803d;
      --expense-bg: #ffedd5;
      --expense-fg: #c2410c;
      --net-fg: #1d4ed8;
      --danger: #dc2626;
      --warn-bg: #fef2f2;
      --warn-border: #fecaca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .board-layout {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .board-layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 17px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      background: #ffffff;
      color: var(--text);
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid rgba(15, 118, 110, 0.2);
      border-color: var(--primary);
    }

    .hint-toast {
      display: none;
      margin-bottom: 12px;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--danger);
      font-size: 13px;
    }

    .hint-toast.visible {
      display: block;
    }

    .btn-primary {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-secondary {
      flex: 1;
      min-width: 120px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #eef2f7;
    }

    .goal-panel {
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f0fdfa 0%, #f8fafc 100%);
      border: 1px solid #99f6e4;
      margin-bottom: 16px;
    }

    .goal-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .goal-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f766e;
    }

    .goal-target-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #334155;
    }

    .goal-target-ctrl input {
      width: 105px;
      padding: 5px 8px;
      border: 1px solid #99f6e4;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0d9488, #16a34a);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .goal-caption {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 680px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .metric-box {
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    .metric-label {
      font-size: 12px;
      color: var(--muted);
    }

    .metric-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 700;
    }

    .metric-income {
      color: var(--income-fg);
    }

    .metric-expense {
      color: var(--expense-fg);
    }

    .metric-net {
      color: var(--net-fg);
    }

    .category-bars {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    .category-bars-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 76px 1fr 88px;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .bar-row:last-child {
      margin-bottom: 0;
    }

    .bar-track {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill-income {
      height: 100%;
      background: #16a34a;
      border-radius: 999px;
    }

    .bar-fill-expense {
      height: 100%;
      background: #ea580c;
      border-radius: 999px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .filter-bar select {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 13px;
      background: #ffffff;
    }

    .record-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      background: #ffffff;
    }

    .record-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-income {
      background: var(--income-bg);
      color: var(--income-fg);
    }

    .badge-expense {
      background: var(--expense-bg);
      color: var(--expense-fg);
    }

    .tag-category {
      padding: 2px 8px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 500;
    }

    .record-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .record-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .record-amount {
      font-size: 15px;
      font-weight: 700;
    }

    .btn-delete {
      padding: 5px 10px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff1f2;
      color: var(--danger);
      font-size: 12px;
      cursor: pointer;
    }

    .empty-state {
      padding: 28px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>门店/个人经营收支与目标追踪可视化看板</h1>
      <p>单文件离线运行 · 月度营收目标进度追踪 · 自动保存至浏览器 localStorage · 支持防乱码 CSV 对账导出</p>
    </header>

    <div class="board-layout">
      <section class="card" aria-label="录入面板">
        <h2>新增经营流水</h2>
        <div id="formWarning" class="hint-toast" role="alert"></div>

        <form id="entryForm" novalidate>
          <div class="field">
            <label for="dateInput">发生日期</label>
            <input id="dateInput" type="date" required />
          </div>

          <div class="field">
            <label for="titleInput">事项摘要</label>
            <input id="titleInput" type="text" placeholder="如：市集现磨零售 / 云南生豆补货（假设）" />
          </div>

          <div class="field">
            <label for="typeInput">收支类型</label>
            <select id="typeInput">
              <option value="经营收入">经营收入</option>
              <option value="经营支出">经营支出</option>
            </select>
          </div>

          <div class="field">
            <label for="categoryInput">经营分类</label>
            <select id="categoryInput">
              <option value="门店零售">门店零售</option>
              <option value="线上团购">线上团购</option>
              <option value="原料采购">原料采购</option>
              <option value="水电杂费">水电杂费</option>
            </select>
          </div>

          <div class="field">
            <label for="amountInput">假设金额（元）</label>
            <input id="amountInput" type="number" min="0.01" step="0.01" value="120" />
          </div>

          <button class="btn-primary" type="submit">保存流水</button>
        </form>

        <div class="toolbar-actions">
          <button id="demoBtn" class="btn-secondary" type="button">填入示例数据</button>
          <button id="exportCsvBtn" class="btn-secondary" type="button">导出 CSV</button>
        </div>
      </section>

      <section class="card" aria-label="目标追踪与筛选面板">
        <div class="goal-panel">
          <div class="goal-header">
            <span class="goal-title">月度营收目标追踪进度</span>
            <label class="goal-target-ctrl" for="targetInput">
              月目标（假设元）
              <input id="targetInput" type="number" min="1" step="100" value="5000" />
            </label>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div id="goalProgressFill" class="progress-fill"></div>
          </div>
          <div class="goal-caption">
            <span id="goalProgressText">当前累计营收 ¥0.00（达成 0.0%）</span>
            <span id="goalRemainText">距目标还差 ¥5000.00</span>
          </div>
        </div>

        <div class="summary-grid">
          <div class="metric-box">
            <div class="metric-label">当前筛选笔数</div>
            <div id="visibleCount" class="metric-value">0 笔</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">经营总收入</div>
            <div id="incomeTotal" class="metric-value metric-income">¥0.00</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">经营总支出</div>
            <div id="expenseTotal" class="metric-value metric-expense">¥0.00</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">经营净结余</div>
            <div id="netBalance" class="metric-value metric-net">¥0.00</div>
          </div>
        </div>

        <div class="category-bars">
          <div class="category-bars-title">当前筛选各经营分类金额分布</div>
          <div id="categoryBarsContainer"></div>
        </div>

        <div class="filter-bar">
          <label for="filterType">收支筛选：</label>
          <select id="filterType">
            <option value="全部">全部类型</option>
            <option value="经营收入">经营收入</option>
            <option value="经营支出">经营支出</option>
          </select>

          <label for="filterCategory">分类筛选：</label>
          <select id="filterCategory">
            <option value="全部">全部分类</option>
            <option value="门店零售">门店零售</option>
            <option value="线上团购">线上团购</option>
            <option value="原料采购">原料采购</option>
            <option value="水电杂费">水电杂费</option>
          </select>
        </div>

        <ul id="recordList" class="record-list"></ul>
      </section>
    </div>
  </div>

  <script>
    const RECORDS_STORAGE_KEY = "aid_s5_m09_biz_ledger_records_v2";
    const TARGET_STORAGE_KEY = "aid_s5_m09_biz_monthly_target_v2";
    const CATEGORIES = ["门店零售", "线上团购", "原料采购", "水电杂费"];

    const DEMO_RECORDS = [
      { id: "rec-01", date: "2026-03-01", title: "手冲精品挂耳礼盒首团（假设）", type: "经营收入", category: "线上团购", amount: 1680.0 },
      { id: "rec-02", date: "2026-03-01", title: "云南水洗咖啡生豆, 10kg装（假设）", type: "经营支出", category: "原料采购", amount: 620.5 },
      { id: "rec-03", date: "2026-03-02", title: "周末社区市集现磨饮品零售（假设）", type: "经营收入", category: "门店零售", amount: 1250.0 },
      { id: "rec-04", date: "2026-03-02", title: "门店电费与宽带月度分摊（假设）", type: "经营支出", category: "水电杂费", amount: 310.0 },
      { id: "rec-05", date: "2026-03-03", title: "燕麦奶整箱补货 \"咖啡师专用版\"（假设）", type: "经营支出", category: "原料采购", amount: 240.0 },
      { id: "rec-06", date: "2026-03-03", title: "周边写字楼下午茶拼单（假设）", type: "经营收入", category: "线上团购", amount: 890.0 }
    ];

    function loadRecords() {
      try {
        const raw = localStorage.getItem(RECORDS_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function saveRecords(list) {
      localStorage.setItem(RECORDS_STORAGE_KEY, JSON.stringify(list));
    }

    function loadMonthlyTarget() {
      const raw = Number(localStorage.getItem(TARGET_STORAGE_KEY));
      return Number.isFinite(raw) && raw > 0 ? raw : 5000;
    }

    function saveMonthlyTarget(val) {
      localStorage.setItem(TARGET_STORAGE_KEY, String(val));
    }

    let records = loadRecords();
    let monthlyTarget = loadMonthlyTarget();

    function getTodayISO() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function showWarning(msg) {
      const box = document.getElementById("formWarning");
      if (!msg) {
        box.textContent = "";
        box.classList.remove("visible");
        return;
      }
      box.textContent = msg;
      box.classList.add("visible");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeCsvCell(val) {
      const text = String(val ?? "");
      if (text.includes(",") || text.includes("\"") || text.includes("\n")) {
        return `"${text.replace(/"/g, "\"\"")}"`;
      }
      return text;
    }

    function getFilteredRecords() {
      const selectedType = document.getElementById("filterType").value;
      const selectedCategory = document.getElementById("filterCategory").value;
      return records.filter((item) => {
        const matchType = selectedType === "全部" || item.type === selectedType;
        const matchCategory = selectedCategory === "全部" || item.category === selectedCategory;
        return matchType && matchCategory;
      });
    }

    function computeSummary(list) {
      const incomeTotal = list
        .filter((item) => item.type === "经营收入")
        .reduce((acc, item) => acc + (Number(item.amount) || 0), 0);
      const expenseTotal = list
        .filter((item) => item.type === "经营支出")
        .reduce((acc, item) => acc + (Number(item.amount) || 0), 0);
      return {
        visibleCount: list.length,
        incomeTotal,
        expenseTotal,
        netBalance: incomeTotal - expenseTotal
      };
    }

    function renderGoalProgress() {
      const allIncome = records
        .filter((item) => item.type === "经营收入")
        .reduce((acc, item) => acc + (Number(item.amount) || 0), 0);
      const safeTarget = monthlyTarget > 0 ? monthlyTarget : 5000;
      const rawPct = (allIncome / safeTarget) * 100;
      const barWidth = Math.min(100, Math.max(0, rawPct));
      const remain = Math.max(0, safeTarget - allIncome);

      document.getElementById("goalProgressFill").style.width = `${barWidth.toFixed(1)}%`;
      document.getElementById("goalProgressText").textContent =
        `当前累计营收 ¥${allIncome.toFixed(2)}（达成 ${rawPct.toFixed(1)}%）`;
      document.getElementById("goalRemainText").textContent =
        remain > 0 ? `距目标还差 ¥${remain.toFixed(2)}` : "已超额达成月度营收目标！";
    }

    function renderCategoryBars(filtered) {
      const container = document.getElementById("categoryBarsContainer");
      const totals = CATEGORIES.map((cat) => {
        const sum = filtered
          .filter((r) => r.category === cat)
          .reduce((acc, r) => acc + (Number(r.amount) || 0), 0);
        const isIncomeCat = cat === "门店零售" || cat === "线上团购";
        return { cat, sum, isIncomeCat };
      });
      const maxVal = Math.max(1, ...totals.map((t) => t.sum));

      container.innerHTML = totals
        .map((t) => {
          const pct = Math.min(100, (t.sum / maxVal) * 100);
          const fillClass = t.isIncomeCat ? "bar-fill-income" : "bar-fill-expense";
          return `
            <div class="bar-row">
              <span>${escapeHtml(t.cat)}</span>
              <div class="bar-track">
                <div class="${fillClass}" style="width: ${pct.toFixed(1)}%"></div>
              </div>
              <span style="text-align:right;font-weight:600;">¥${t.sum.toFixed(2)}</span>
            </div>
          `;
        })
        .join("");
    }

    function renderBoard() {
      renderGoalProgress();

      const filtered = getFilteredRecords();
      const summary = computeSummary(filtered);

      document.getElementById("visibleCount").textContent = `${summary.visibleCount} 笔`;
      document.getElementById("incomeTotal").textContent = `¥${summary.incomeTotal.toFixed(2)}`;
      document.getElementById("expenseTotal").textContent = `¥${summary.expenseTotal.toFixed(2)}`;
      const sign = summary.netBalance < 0 ? "-" : "";
      document.getElementById("netBalance").textContent =
        `${sign}¥${Math.abs(summary.netBalance).toFixed(2)}`;

      renderCategoryBars(filtered);

      const listEl = document.getElementById("recordList");
      if (filtered.length === 0) {
        listEl.innerHTML = `<li class="empty-state">当前筛选条件下暂无经营流水，可左侧录入或点击“填入示例数据”一键体验。</li>`;
        return;
      }

      listEl.innerHTML = filtered
        .map((item) => {
          const isIncome = item.type === "经营收入";
          const badgeClass = isIncome ? "badge badge-income" : "badge badge-expense";
          const amountPrefix = isIncome ? "+" : "-";
          return `
            <li class="record-item">
              <div>
                <div class="record-meta">
                  <span>${escapeHtml(item.date)}</span>
                  <span class="${badgeClass}">${escapeHtml(item.type)}</span>
                  <span class="tag-category">${escapeHtml(item.category)}</span>
                </div>
                <div class="record-title">${escapeHtml(item.title)}</div>
              </div>
              <div class="record-right">
                <span class="record-amount">${amountPrefix}¥${Number(item.amount || 0).toFixed(2)}</span>
                <button class="btn-delete" type="button" data-delete-id="${escapeHtml(item.id)}">删除</button>
              </div>
            </li>
          `;
        })
        .join("");
    }

    document.getElementById("dateInput").value = getTodayISO();
    document.getElementById("targetInput").value = String(monthlyTarget);

    document.getElementById("targetInput").addEventListener("input", (event) => {
      const nextVal = Number(event.target.value);
      if (Number.isFinite(nextVal) && nextVal > 0) {
        monthlyTarget = nextVal;
        saveMonthlyTarget(monthlyTarget);
        renderGoalProgress();
      }
    });

    document.getElementById("entryForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const cleanTitle = document.getElementById("titleInput").value.trim();
      if (!cleanTitle) {
        showWarning("请先填写事项摘要，不能为空或纯空格。");
        document.getElementById("titleInput").focus();
        return;
      }

      const rawAmount = Number(document.getElementById("amountInput").value);
      if (!Number.isFinite(rawAmount) || rawAmount <= 0) {
        showWarning("请输入大于 0 的有效金额数字。");
        document.getElementById("amountInput").focus();
        return;
      }

      showWarning("");
      records.unshift({
        id: `rec-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        date: document.getElementById("dateInput").value || getTodayISO(),
        title: cleanTitle,
        type: document.getElementById("typeInput").value,
        category: document.getElementById("categoryInput").value,
        amount: rawAmount
      });
      saveRecords(records);
      document.getElementById("titleInput").value = "";
      renderBoard();
    });

    document.getElementById("recordList").addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      const deleteId = target.getAttribute("data-delete-id");
      if (!deleteId) return;
      if (!window.confirm("确定要删除这条经营流水吗？删除后无法撤销。")) {
        return;
      }
      records = records.filter((item) => item.id !== deleteId);
      saveRecords(records);
      renderBoard();
    });

    document.getElementById("filterType").addEventListener("change", renderBoard);
    document.getElementById("filterCategory").addEventListener("change", renderBoard);

    document.getElementById("demoBtn").addEventListener("click", () => {
      showWarning("");
      records = DEMO_RECORDS.map((item) => ({ ...item }));
      monthlyTarget = 5000;
      document.getElementById("targetInput").value = "5000";
      saveMonthlyTarget(monthlyTarget);
      saveRecords(records);
      renderBoard();
    });

    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      const filtered = getFilteredRecords();
      const headers = ["日期", "事项摘要", "收支类型", "经营分类", "假设金额"];
      const lines = [headers.map(escapeCsvCell).join(",")];
      filtered.forEach((item) => {
        lines.push([
          item.date,
          item.title,
          item.type,
          item.category,
          Number(item.amount || 0).toFixed(2)
        ].map(escapeCsvCell).join(","));
      });

      const csvContent = "\uFEFF" + lines.join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", `biz-ledger-${getTodayISO()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    renderBoard();
  </script>
</body>
</html>
