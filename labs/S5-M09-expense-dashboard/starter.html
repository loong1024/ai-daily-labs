<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>门店/个人经营收支与目标追踪可视化看板（Starter 初稿）</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 24px;
      color: #1f2937;
      background: #f8fafc;
    }
    .box {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-top: 8px;
      font-size: 14px;
    }
    input, select, button {
      margin-top: 4px;
      padding: 6px 10px;
      font-size: 14px;
    }
    /* TODO(第二轮)：升级为桌面左录入右看板、移动端(@media)单栏的圆角卡片布局，并为经营收入/经营支出配置翠绿与暖橙双色标签 */
  </style>
</head>
<body>
  <h1>门店/个人经营收支与目标追踪可视化看板</h1>

  <div class="box">
    <h2>新增经营流水</h2>
    <label>日期
      <input id="dateInput" type="date" value="2026-03-01" />
    </label>
    <label>事项摘要
      <input id="titleInput" type="text" placeholder="例如：周末市集饮品零售 / 云南咖啡豆采购（假设）" />
    </label>
    <label>收支类型
      <select id="typeInput">
        <option value="经营收入">经营收入</option>
        <option value="经营支出">经营支出</option>
      </select>
    </label>
    <label>经营分类
      <select id="categoryInput">
        <option value="门店零售">门店零售</option>
        <option value="线上团购">线上团购</option>
        <option value="原料采购">原料采购</option>
        <option value="水电杂费">水电杂费</option>
      </select>
    </label>
    <label>假设金额（元）
      <input id="amountInput" type="number" step="0.01" value="120" />
    </label>
    <button id="addBtn" type="button">保存流水</button>
    <!-- TODO(第三轮)：新增“填入示例数据”与“导出 CSV”按钮 -->
  </div>

  <div class="box">
    <h2>流水明细</h2>
    <!-- TODO(第一轮)：补充月度营收目标设定与可视化达成进度条、各分类占比条形图、类型/分类筛选下拉框及总收入/总支出/净结余实时汇总 -->
    <ul id="recordList"></ul>
  </div>

  <script>
    // 当前仅保存在内存数组中，刷新页面即丢失！
    // TODO(第一轮)：接入 localStorage 持久保存流水与月度目标，渲染目标达成率进度条与收支净结余汇总。
    // TODO(第二轮)：事项摘要为空或金额 <= 0 时拦截提交并轻提示；单条删除前调用 confirm 二次确认。
    // TODO(第三轮)：支持一键填入 6 条基准示例数据，以及导出带 \uFEFF BOM 头与双引号转义的 CSV 文件。
    const records = [];

    function render() {
      const listEl = document.getElementById("recordList");
      listEl.innerHTML = records
        .map((item) => `<li>${item.date} [${item.type}/${item.category}] ${item.title} - ¥${item.amount}</li>`)
        .join("");
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      records.push({
        date: document.getElementById("dateInput").value,
        title: document.getElementById("titleInput").value,
        type: document.getElementById("typeInput").value,
        category: document.getElementById("categoryInput").value,
        amount: Number(document.getElementById("amountInput").value || 0),
      });
      render();
    });
  </script>
</body>
</html>
